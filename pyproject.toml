[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatNLP"
dynamic = ["version"]
description = "ChatNLP: ChatArch placeholder package for NLP workflows with a truthful CLI tree."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatenv>=0.2.0,<0.3.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatnlp", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatNLP"
Repository = "https://github.com/ChatArch/ChatNLP"
Documentation = "https://arch.gh.wzhecnu.cn/ChatNLP/"

[project.scripts]
chatnlp = "chatnlp.cli:main"

[project.entry-points."chatenv.configs"]
chatnlp = "chatnlp.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatnlp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
